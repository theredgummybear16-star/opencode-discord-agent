name: opencode-agent

on:
  workflow_dispatch: {}
  schedule:
    - cron: "13 */5 * * *"

concurrency:
  group: opencode-agent
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deps
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt >/dev/null 2>&1

      - name: opencode
        run: |
          set +e
          for i in 1 2 3; do
            curl -fsSL https://opencode.ai/install | bash >/dev/null 2>&1
            if command -v opencode >/dev/null 2>&1 || [ -x "$HOME/.opencode/bin/opencode" ]; then FOUND=1; break; fi
            sleep $((i*8))
          done
          if [ -z "$FOUND" ]; then
            (npm install -g opencode-ai >/dev/null 2>&1) || true
            command -v opencode >/dev/null 2>&1 && FOUND=1
          fi
          if [ -z "$FOUND" ]; then exit 1; fi
          [ -d "$HOME/.opencode/bin" ] && echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          set -e

      - name: agent
        timeout-minutes: 320
        env:
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          BRAIN_PASSPHRASE: ${{ secrets.BRAIN_PASSPHRASE }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AUTH_JSON: ${{ secrets.AUTH_JSON }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          SYSTEM_NOTES: ${{ secrets.SYSTEM_NOTES }}
          GH_REPO: ${{ github.repository }}
        run: python supervisor.py >/dev/null 2>&1